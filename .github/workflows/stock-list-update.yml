name: 📋 Stock List Update

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      market:
        description: "市場 (日本株=JP / 米国株=US)"
        required: true
        default: "JP"
        type: choice
        options:
          - "JP"
          - "US"
      reason:
        description: "Update reason (optional)"
        required: false
        default: "Manual stock list update"
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-stock-list:
    runs-on: ubuntu-24.04
    # US は SEC の全ティッカーを yfinance で照会するため長め
    timeout-minutes: 300
    permissions:
      contents: write
    # 入力値は run: に直接展開せず環境変数経由で参照する（スクリプトインジェクション対策）
    env:
      MARKET: ${{ inputs.market }}
      REASON: ${{ inputs.reason }}

    steps:
      # 後続ステップで push するため認証情報を保持（.git は artifact に含めない）
      - name: 🔄 Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_list/requirements.txt

      - name: 📋 Show input parameters
        run: |
          echo "Market: $MARKET"
          echo "Update reason: $REASON"
          echo "Timestamp: $(date)"
          echo "Working directory: $(pwd)"
          ls -la stock_list/

      - name: 🔐 Check SEC_USER_AGENT_CONTACT (required for US)
        if: inputs.market == 'US'
        env:
          SEC_USER_AGENT_CONTACT: ${{ secrets.SEC_USER_AGENT_CONTACT }}
        run: |
          if [ -z "$SEC_USER_AGENT_CONTACT" ]; then
            echo "::error::米国株リスト取得には SEC_USER_AGENT_CONTACT が必要です。"
            echo "リポジトリの Settings → Secrets and variables → Actions で SEC_USER_AGENT_CONTACT を追加し、あなたのメールアドレスを設定してください。"
            echo "参考: https://www.sec.gov/os/accessing-edgar-data"
            exit 1
          fi
          echo "✅ SEC_USER_AGENT_CONTACT が設定されています"

      - name: 🌐 Fetch latest stock list
        working-directory: ./stock_list
        env:
          SEC_USER_AGENT_CONTACT: ${{ secrets.SEC_USER_AGENT_CONTACT }}
        run: |
          echo "🚀 Starting stock list download (market=$MARKET)..."
          echo "Timestamp: $(date)"

          if [ "$MARKET" = "US" ]; then
            python get_us_stocklist.py
            MASTER=us_stocks_all.json
          else
            python get_jp_stocklist.py
            MASTER=stocks_all.json
          fi

          echo "✅ Stock list download completed"
          if [ -f "$MASTER" ]; then
            echo "📊 $MASTER created successfully"
            echo "File size: $(ls -lh "$MASTER" | awk '{print $5}')"
            echo "Total companies: $(jq length "$MASTER")"
          else
            echo "❌ Error: $MASTER not found"
            exit 1
          fi

      - name: ✂️ Split into chunks
        working-directory: ./stock_list
        run: |
          echo "🔀 Starting stock list splitting (market=$MARKET)..."
          echo "Timestamp: $(date)"

          if [ "$MARKET" = "US" ]; then
            python split_stocks.py --input us_stocks_all.json --size 1000
            PREFIX=us_stocks_
          else
            python split_stocks.py --input stocks_all.json --size 1000
            PREFIX=stocks_
          fi

          echo "✅ Splitting completed"
          echo "📄 Generated files:"
          ls -la ${PREFIX}*.json 2>/dev/null || true

          echo "🔍 Verifying split files..."
          for file in ${PREFIX}[0-9]*.json; do
            if [ -f "$file" ]; then
              if companies=$(jq length "$file" 2>/dev/null); then
                echo "✅ $file: $companies companies (Valid JSON)"
              else
                echo "❌ $file: Invalid JSON format"
                exit 1
              fi
            fi
          done

      - name: 📊 Generate update summary
        working-directory: ./stock_list
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$MARKET" = "US" ]; then
            MASTER=us_stocks_all.json
            PREFIX=us_stocks_
            REPORT=us_stock_list_update_report.md
            TITLE="US Stock List Update Report"
          else
            MASTER=stocks_all.json
            PREFIX=stocks_
            REPORT=stock_list_update_report.md
            TITLE="Stock List Update Report"
          fi

          {
            echo "# 📋 $TITLE"
            echo ""
            echo "**Market:** $MARKET"
            echo "**Generated:** $(date)"
            echo "**Reason:** $REASON"
            echo "**Workflow:** $GITHUB_WORKFLOW"
            echo ""

            if [ -f "$MASTER" ]; then
              echo "## 📊 Master List"
              echo "- **File:** $MASTER"
              echo "- **Size:** $(ls -lh "$MASTER" | awk '{print $5}')"
              echo "- **Total Companies:** $(jq length "$MASTER")"
              echo ""
            fi

            echo "## 📂 Split Files"
            echo ""
            for file in ${PREFIX}[0-9]*.json; do
              if [ -f "$file" ]; then
                echo "- **$file** - Size: $(ls -lh "$file" | awk '{print $5}'), Companies: $(jq length "$file")"
              fi
            done

            echo ""
            echo "## 🤖 Automation Info"
            echo "- **GitHub Action:** [$GITHUB_WORKFLOW]($RUN_URL)"
            echo "- **Commit SHA:** $GITHUB_SHA"
            echo "- **Repository:** $GITHUB_REPOSITORY"
          } > "$REPORT"

      - name: 🔧 Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit and push changes
        run: |
          if [ "$MARKET" = "US" ]; then
            # pathspec をクォートして git 側で展開（削除された古い分割ファイルもステージされる）
            git add -A -- 'stock_list/us_stocks_*.json' stock_list/us_stock_list_update_report.md
            LABEL="米国株式"
          else
            git add -A -- 'stock_list/stocks_*.json' stock_list/stock_list_update_report.md
            LABEL="日本株式"
          fi

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(date '+%Y年%m月%d日')
          git commit -F - <<EOF
          📋 ${LABEL}のリストを更新($CURRENT_DATE)

          - 市場: $MARKET
          - 更新理由: $REASON
          - 実行日時: $(date)
          - ワークフロー: $GITHUB_WORKFLOW

          🤖 Generated by GitHub Action
          EOF

          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          echo "✅ Changes committed and pushed successfully"

      - name: 📈 Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stock-list-update-${{ inputs.market }}-${{ github.run_id }}
          path: |
            stock_list/stocks_*.json
            stock_list/stock_list_update_report.md
            stock_list/us_stocks_*.json
            stock_list/us_stock_list_update_report.md
          if-no-files-found: ignore
          retention-days: 30
