# セキュリティヘッダ（nginx は location 内で add_header すると server の add_header を継承しないため、
# 各 location から include する）
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# 旧ブラウザの XSS Auditor は副作用があるため明示的に無効化（OWASP 推奨）
add_header X-XSS-Protection "0" always;
