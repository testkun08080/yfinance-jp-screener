version: 2
updates:
  # GitHub Actions（SHA ピン留めしたアクションの更新 PR を作成）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 公開直後のリリース（侵害されたパッケージ等）を避けるため 7 日待つ
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # フロントエンド
  - package-ecosystem: "npm"
    directory: "/stock_search"
    schedule:
      interval: "weekly"
    # 公開直後のリリース（侵害されたパッケージ等）を避けるため 7 日待つ
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # データ収集スクリプト
  - package-ecosystem: "pip"
    directory: "/stock_list"
    schedule:
      interval: "weekly"
    # 公開直後のリリース（侵害されたパッケージ等）を避けるため 7 日待つ
    cooldown:
      default-days: 7
