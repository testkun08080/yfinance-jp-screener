[project]
name = "stock-list"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "curl_cffi>=0.15.0",
    "pandas>=2.2.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.5",
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pip-licenses>=5.0.0",
]


[tool.pip-licenses]
# 出力形式
format = "markdown"


# 無視するパッケージ
ignore-packages = [
  "scipy",
  "numpy"
]

# 許可されないライセンスでエラー
fail-on = "MIT;AGPL;LGPL"