name: 📊 Stock Data Fetch

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      market:
        description: "市場 (日本株=JP / 米国株=US)"
        required: true
        default: "JP"
        type: choice
        options:
          - "JP"
          - "US"
      stock_file:
        description: "処理するJSONファイル (市場に合わせて選択)"
        required: true
        default: "stocks_1.json"
        type: choice
        options:
          - "stocks_1.json"
          - "stocks_2.json"
          - "stocks_3.json"
          - "stocks_4.json"
          - "stocks_sample.json"
          - "us_stocks_1.json"
          - "us_stocks_2.json"
          - "us_stocks_3.json"
          - "us_stocks_4.json"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-stock-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MARKET: ${{ inputs.market }}
      STOCK_FILE: ${{ inputs.stock_file }}

    steps:
      # 後続ステップで push するため認証情報を保持（.git は artifact に含めない）
      - name: 🔄 Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_list/requirements.txt

      - name: 📋 Show input parameters
        run: |
          echo "Market: $MARKET"
          echo "Processing file: $STOCK_FILE"
          echo "Working directory: $(pwd)"
          ls -la stock_list/

      - name: 🏃 Run stock data collection
        working-directory: ./stock_list
        run: |
          echo "🚀 Starting stock data collection..."
          echo "File: $STOCK_FILE"
          echo "Timestamp: $(date)"

          python sumalize.py "$STOCK_FILE"

          echo "✅ Stock data collection completed"
          echo "📄 Generated files in Export directory:"
          ls -la Export/ 2>/dev/null || echo "No files in Export directory"

      - name: Git config and pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin "$GITHUB_REF_NAME" --rebase

      - name: 💾 Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "📊 Stock Data Fetch - ${{ inputs.market }} ${{ inputs.stock_file }}"
