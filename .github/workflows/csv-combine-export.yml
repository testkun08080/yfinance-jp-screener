name: 📋 CSV Combine & Export

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      custom_date:
        description: "対象日付 (YYYYMMDD形式、空白の場合は今日の日付)"
        required: false
        default: ""
        type: string
      reason:
        description: "CSV結合の理由"
        required: false
        default: "Latest CSV files combination"
        type: string
      market_type:
        description: "市場 (JP: 日本株, US: 米国株, both: 両方)"
        required: false
        default: "JP"
        type: choice
        options:
          - "JP"
          - "US"
          - "both"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  combine-csv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # 入力値は run: に直接展開せず環境変数経由で参照する（スクリプトインジェクション対策）
    env:
      DATE_INPUT: ${{ inputs.custom_date }}
      REASON: ${{ inputs.reason }}
      MT: ${{ inputs.market_type || 'JP' }}

    steps:
      # 後続ステップで push するため認証情報を保持（.git は artifact に含めない）
      - name: 🔄 Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_list/requirements.txt

      - name: 📋 Show input parameters
        run: |
          echo "Target date: ${DATE_INPUT:-today}"
          echo "Reason: $REASON"
          echo "Market type: $MT"
          echo "Working directory: $(pwd)"
          echo "Current CSV files in Export directory:"
          ls -la stock_list/Export/ 2>/dev/null || echo "No files in Export directory"

      - name: 🔍 Check existing CSV files
        working-directory: ./stock_list
        run: |
          echo "📄 Existing CSV files (JP):"
          find Export/ -name "japanese_stocks_data_*.csv" -type f | sort -r | head -10 || echo "No JP CSV files found"
          echo ""
          echo "📄 Existing CSV files (US):"
          find Export/ -name "us_stocks_data_*.csv" -type f | sort -r | head -10 || echo "No US CSV files found"
          echo ""
          echo "📊 File statistics (JP):"
          find Export/ -name "japanese_stocks_data_*.csv" -type f -exec ls -lh {} \; | head -5 || true
          echo "📊 File statistics (US):"
          find Export/ -name "us_stocks_data_*.csv" -type f -exec ls -lh {} \; | head -5 || true

      - name: 🔗 Combine latest CSV files
        working-directory: ./stock_list
        run: |
          echo "🚀 Starting CSV combination (market_type=$MT)..."
          echo "Timestamp: $(date)"

          # Validate custom_date: if provided, must be exactly YYYYMMDD (8 digits)
          if [ -n "$DATE_INPUT" ]; then
            if ! echo "$DATE_INPUT" | grep -qE '^[0-9]{8}$'; then
              echo "❌ Invalid custom_date: must be YYYYMMDD (8 digits), got: $DATE_INPUT"
              exit 1
            fi
            echo "Target date: $DATE_INPUT"
          else
            echo "Target date: today ($(date +'%Y%m%d'))"
          fi

          # Whitelist market_type (choice input already restricts; enforce in script)
          case "$MT" in
            JP|US|both) ;;
            *) echo "⚠️ Invalid market_type, defaulting to JP"; MT=JP ;;
          esac

          # Base args (date only); run combination per market so "both" produces JP + US files
          ARGS=()
          if [ -n "$DATE_INPUT" ]; then
            ARGS+=(--date "$DATE_INPUT")
          fi

          if [ "$MT" = "JP" ] || [ "$MT" = "both" ]; then
            echo "Combining JP market: ${ARGS[*]} --market-type JP"
            python combine_latest_csv.py "${ARGS[@]}" --market-type JP
          fi
          if [ "$MT" = "US" ] || [ "$MT" = "both" ]; then
            echo "Combining US market: ${ARGS[*]} --market-type US"
            python combine_latest_csv.py "${ARGS[@]}" --market-type US
          fi

          echo "✅ CSV combination completed"
          echo "📄 Generated files:"
          ls -la Export/*_combined.csv Export/*_jp_combined.csv Export/*_us_combined.csv 2>/dev/null || echo "No combined files generated"

      - name: 📊 Show combination results
        working-directory: ./stock_list
        run: |
          echo "🎯 Combination Results:"
          echo "===================="
          for file in Export/*_combined.csv Export/*_jp_combined.csv Export/*_us_combined.csv; do
            if [ -f "$file" ]; then
              echo "📁 File: $(basename "$file")"
              echo "📏 Size: $(ls -lh "$file" | awk '{print $5}')"
              echo "📊 Lines: $(wc -l < "$file") rows"
              echo "📅 Modified: $(date -r "$file" '+%Y-%m-%d %H:%M:%S')"
              echo "--------------------"
            fi
          done
          echo "📂 Export Directory Status:"
          ls -lah Export/ | head -20

      - name: 🔧 Git configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: 💾 Commit and push combined CSV
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "📊 CSV結合ファイル生成 market=${{ inputs.market_type || 'JP' }}"


