    value_weight: 0.5
    quality_weight: 0.5
    market: Prime
    filters:
      per_max: 20
      pbr_max: 2.0

  pullback-jp:
    description: "押し目買い: テクニカル+クオリティ重視"
    value_weight: 0.3
    quality_weight: 0.7
    market: Prime
    filters:
      roe_min: 0.08

  high-netcash-jp:
    description: "高ネットキャッシュ: 財務安全性重視"
    value_weight: 0.4
    quality_weight: 0.6
    market: Prime
    filters:
      net_cash_ratio_min: 0.2

  daytrade-liquid:
    description: "デイトレ向け: 流動性・モメンタム重視"
    value_weight: 0.2
    quality_weight: 0.8
    market: Prime
    filters:
      min_market_cap: 100000000000

